name: Test Building

on: [push, pull_request]

concurrency:
  group: cstrike-builds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    name: Build ${{ matrix.target }}
    runs-on: windows-2022
    timeout-minutes: 90

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - target: windows-amd64-cstrike
            configure: ./waf.bat configure -T release --build-games=cstrike --enable-opus --disable-warns --prefix="./output"

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Build ${{ matrix.target }}
        shell: pwsh
        run: |
          ${{ matrix.configure }}
          ./waf.bat install

      - name: Remove debug artifacts
        if: success()
        shell: pwsh
        run: |
          if (Test-Path "./output") {
            Get-ChildItem -Path "./output" -Include *.pdb,*.lib -Recurse | Remove-Item -Force
          }

      - name: Upload ${{ matrix.target }} artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cstrike-${{ matrix.target }}
          path: ./output
          if-no-files-found: error
      build-linux:
    name: Build linux-i386-dedicated-cstrike
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive
      - name: Build linux-i386-dedicated-cstrike
        run: |
          ./waf configure -T release --build-games=cstrike -4 -d --disable-warns --prefix="./output"
          ./waf install
      - name: Upload linux-i386-dedicated-cstrike artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cstrike-linux-i386-dedicated-cstrike
          path: ./output
          if-no-files-found: error

name: Test Builds

on: [push, pull_request]

concurrency:
  group: cstrike-builds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - target: windows-amd64-cstrike
            os: windows-2022
            configure: ./waf.bat configure -T release --build-games=cstrike --enable-opus --disable-warns --prefix="./output"
            platform: windows

          - target: linux-i386-dedicated-cstrike
            os: ubuntu-22.04
            configure: ./waf configure -T release --build-games=cstrike -4 -d --disable-warns --prefix="./output"
            platform: linux

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Build ${{ matrix.target }}
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          ${{ matrix.configure }}
          ./waf.bat install

      - name: Build ${{ matrix.target }}
        if: matrix.platform == 'linux'
        run: |
          ${{ matrix.configure }}
          ./waf install

      - name: Remove debug artifacts
        if: success() && matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (Test-Path "./output") {
            Get-ChildItem -Path "./output" -Include *.pdb,*.lib -Recurse | Remove-Item -Force
          }

      - name: Upload ${{ matrix.target }} artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cstrike-${{ matrix.target }}
          path: ./output
          if-no-files-found: error
          
